[package]
name = "inboxcraft-time"
description = "InboxCraft: clocks, dates and time zones, the same on native and wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# `std` has no clock on wasm32-unknown-unknown; `web-time` reads the browser's (native builds use `std`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = { workspace = true }
