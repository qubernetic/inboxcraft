[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/inboxcraft", "apps/inboxcraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qubernetic/inboxcraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# internal crates (every crate is registered here and in xtask/src/layers.rs)
inboxcraft-control-key = { path = "crates/control-key" }
inboxcraft-time = { path = "crates/time" }
inboxcraft-charset = { path = "crates/charset" }
inboxcraft-model = { path = "crates/model" }
inboxcraft-html = { path = "crates/html" }
inboxcraft-store = { path = "crates/store" }
inboxcraft-mime = { path = "crates/mime" }
inboxcraft-ical = { path = "crates/ical" }
inboxcraft-vcard = { path = "crates/vcard" }
inboxcraft-proto = { path = "crates/proto" }
inboxcraft-dav = { path = "crates/dav" }
inboxcraft-net = { path = "crates/net" }
inboxcraft-engine = { path = "crates/engine" }
inboxcraft-mcp = { path = "crates/mcp" }
inboxcraft-ui-egui = { path = "crates/ui-egui" }
inboxcraft-testkit = { path = "crates/testkit" }
# reused crates: pin by full rev, record in PROVENANCE.md
# example-crate = { git = "https://github.com/<source>/<repo>", rev = "<40-char sha>", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# charset only: the WHATWG character sets
encoding_rs = "0.8"
# property tests (dev-dependency only)
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
toml = "1"
# time only, on wasm32-unknown-unknown: the browser's clock
web-time = "1"
# testkit only: the test CA, the fake servers' TLS and the test client
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# net only: the operating system's certificate verifier (approved for E1)
rustls-platform-verifier = "0.7"
# net only: HTTPS for autoconfig and ISPDB (approved for E1). rustls with the ring provider `net` hands it and the
# platform verifier: no bundled roots (`webpki-roots`), no gzip, no cookies.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
# net only: DNS messages for MX and SRV (approved for E1), sent over our own std UDP and TCP exchange, no async runtime
# and no DNSSEC. 0.26 or later: 0.25 has RUSTSEC-2026-0118 (in its DNSSEC code, which we do not build).
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
# net and testkit only: the COMPRESS=DEFLATE stream of net, the fake IMAP server and the test client (pure Rust,
# no network)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = "0.3"
# store only, native only: SQLite (public domain, compiled from the bundled amalgamation) with FTS5
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }

# ui-egui and the desktop app only (layer 6): the immediate-mode UI with its bundled fonts (OFL and the Ubuntu Font
# Licence, see NOTICE). No `links` feature: a link in the UI never opens a browser on its own.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
# the desktop app only: the window, through OpenGL (glow) on Wayland or X11; no wgpu, no persistence, no links
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
# ui-egui tests only: drives the UI through its AccessKit tree and refuses controls without an accessible name
egui_kittest = { version = "0.37", default-features = false }
# ui-egui only: writes the `ui_shot` pictures and reads the PNG pictures of a message
png = "0.18"
# ui-egui only: reads the JPEG pictures of a message (already in the graph through `image`, so no new crate)
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

# [patch.crates-io]
# egui/eframe/winit forks, if the Craft forks are used: pin by rev

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
