# Dev container for InboxCraft (docs/development.md). Driven by the justfile;
# see `just --list`. INBOXCRAFT_UID / INBOXCRAFT_GID are passed by the justfile
# from `id -u` / `id -g`.
services:
  rust:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${INBOXCRAFT_UID:-1000}
        GID: ${INBOXCRAFT_GID:-1000}
    init: true
    working_dir: /workspace
    volumes:
      # target/ stays on the bind mount so the host can run the built binaries.
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      CARGO_TERM_COLOR: always
    command: ["sleep", "infinity"]

volumes:
  cargo-registry:
  cargo-git:
