# The fuzz targets, one per parser (docs/development.md, "CI"). An own workspace: cargo-fuzz needs nightly Rust
# and libFuzzer, which the main workspace never sees. Run with `cargo +nightly fuzz run <target>`.
[package]
name = "inboxcraft-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inboxcraft-time = { path = "../crates/time" }
inboxcraft-control-key = { path = "../crates/control-key" }
inboxcraft-charset = { path = "../crates/charset" }
inboxcraft-html = { path = "../crates/html" }
inboxcraft-model = { path = "../crates/model" }
inboxcraft-mime = { path = "../crates/mime" }
inboxcraft-ical = { path = "../crates/ical" }
inboxcraft-dav = { path = "../crates/dav" }
inboxcraft-proto = { path = "../crates/proto" }
inboxcraft-net = { path = "../crates/net" }
inboxcraft-testkit = { path = "../crates/testkit" }
inboxcraft-store = { path = "../crates/store" }
inboxcraft-engine = { path = "../crates/engine" }
inboxcraft-mcp = { path = "../crates/mcp" }
inboxcraft-ui-egui = { path = "../crates/ui-egui" }
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "rfc5322_date"
path = "fuzz_targets/rfc5322_date.rs"
test = false
doc = false
bench = false

