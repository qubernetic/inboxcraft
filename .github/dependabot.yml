# Dependency updates, weekly and grouped (docs/development.md, "CI"). Both entries target develop: the default
# branch is main, and without target-branch Dependabot would open its PRs there.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: "develop"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: "develop"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
