# Temporary, for #70 only, removed again before the PR is ready: measures the dependency opt-level of the CI build.
#
# All three levels on one runner, one after another, so the runner's speed is the same for each. For every level:
# no target/ and no registry (cold), `cargo xtask ci`, drop our own crates from target/ exactly as ci.yml does before
# its cache save, `cargo xtask ci` again (warm, without the cache download). The level goes into
# ~/.cargo/config.toml, whose [profile] settings take precedence over Cargo.toml's.
#
# Hardening as in ci.yml: read-only token, no secrets, no cache, every action pinned by commit SHA.

name: measure-opt-level

on:
  pull_request:
    branches: ['epic/**']

permissions:
  contents: read

concurrency:
  group: measure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner
        run: |
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)'
          free -h
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libfontconfig1-dev libfreetype-dev libdbus-1-dev mesa-vulkan-drivers
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - name: Read the tool versions from the Dockerfile
        id: tools
        run: |
          version() {
            value=$(sed -n "s/^ARG $1=//p" Dockerfile)
            if [ -z "$value" ]; then echo "ARG $1 is missing from the Dockerfile" >&2; exit 1; fi
            echo "$value"
          }
          nextest=$(version CARGO_NEXTEST_VERSION)
          llvm_cov=$(version CARGO_LLVM_COV_VERSION)
          deny=$(version CARGO_DENY_VERSION)
          echo "list=cargo-nextest@$nextest,cargo-llvm-cov@$llvm_cov,cargo-deny@$deny" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: ${{ steps.tools.outputs.list }}
          fallback: none
      - name: Measure levels 0, 1 and 2
        run: |
          prune() {
            names=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '[.packages[] | .name, .targets[].name | ., gsub("-"; "_")] | unique | join("|")')
            ours=".*/(lib)?($names)-[0-9a-f]{16}(\..+)?"
            rm -rf target/nextest target/tmp target/doc
            find target -maxdepth 2 -type f \( -name '*.profraw' -o -name '*.profdata' -o -name '*-profraw-list' \) -delete
            profiles=$(find target -type d -name .fingerprint -prune -printf '%h\n')
            for profile in $profiles; do
              find "$profile" -mindepth 1 -maxdepth 1 ! -name deps ! -name build ! -name .fingerprint -exec rm -rf {} +
              find "$profile" -mindepth 2 -maxdepth 2 -regextype posix-extended -regex "$ours" -exec rm -rf {} +
            done
            du -sh target
          }
          cp ~/.cargo/config.toml ~/.cargo/config.toml.orig 2>/dev/null || touch ~/.cargo/config.toml.orig
          results=()
          for level in 0 1 2; do
            rm -rf target ~/.cargo/registry ~/.cargo/git
            cp ~/.cargo/config.toml.orig ~/.cargo/config.toml
            printf '\n[profile.dev.package."*"]\nopt-level = %s\n' "$level" >> ~/.cargo/config.toml
            echo "::group::level $level cold"
            start=$SECONDS; cargo xtask ci; cold=$((SECONDS - start))
            echo "::endgroup::"
            prune
            echo "::group::level $level warm"
            start=$SECONDS; cargo xtask ci; warm=$((SECONDS - start))
            echo "::endgroup::"
            results+=("level $level: cold ${cold}s, warm ${warm}s")
          done
          printf '%s\n' "${results[@]}"
