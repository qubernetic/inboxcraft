# The workspace CI: `cargo xtask ci`, every gate `just ci` runs, in the same order (docs/development.md, "CI").
#
# Ready-only: on a draft PR every job is skipped, so no runner starts; the full run starts on ready_for_review, on
# every later push to a ready PR, on pushes to develop, main and the epic branches, and on manual dispatch
# (gh workflow run ci.yml --ref <branch>). The `ci` job is the gate: it succeeds only when the full run did.
#
# The `flatpak` job builds the dev Flatpak (contrib/flatpak) into a bundle as build proof and keeps it as an artifact.
#
# Hardening: no pull_request_target, a read-only token everywhere, no stored secrets, every action pinned by commit
# SHA. Only the `codecov` job has `id-token: write`: it uploads the coverage and test results with the job's GitHub
# OIDC token (the repository is private) and runs no repository code.
#
# The one cache, in the `test` job only: compiled third-party dependencies and the cargo registry. Every full run
# restores it; only a push to develop, main or an epic branch saves it, so only reviewed, merged code writes it. A
# pull_request or workflow_dispatch run never saves. Our own crates are deleted from target/ before the save, so no
# artifact of this repository's code is cached. The key rotates weekly and changes with rust-toolchain.toml,
# Cargo.lock and the [profile.*] sections of Cargo.toml. The `codecov` and `flatpak` jobs and fuzz.yml use no cache.
# Purge every entry with `gh cache delete --all`.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main, 'epic/**']
  push:
    branches: [develop, main, 'epic/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Incremental data only pays off on a warm machine, and it would hold our own code: never built, never cached.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache key: ISO week, toolchain, [profile.*] sections, Cargo.lock. A run whose Cargo.lock has no entry yet
      # restores the newest one of the same week, toolchain and profiles and rebuilds only what changed.
      - name: Compute the cache key
        id: cache-key
        env:
          TOOLCHAIN: ${{ hashFiles('rust-toolchain.toml') }}
          LOCK: ${{ hashFiles('Cargo.lock') }}
        run: |
          profiles=$(awk '/^\[/ { keep = /^\[profile\./ } keep' Cargo.toml | sha256sum | cut -d' ' -f1)
          prefix="deps-v1-$RUNNER_OS-$(date -u +%G-W%V)-$TOOLCHAIN-$profiles-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$LOCK" >> "$GITHUB_OUTPUT"
      # Every run restores; the save step at the end runs on pushes only. The paths match the save step's.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      # The Dockerfile's list without the base image's build-essential, ca-certificates, curl and git.
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libfontconfig1-dev libfreetype-dev libdbus-1-dev mesa-vulkan-drivers
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      # One source of truth: the versions the Dockerfile pins.
      - name: Read the tool versions from the Dockerfile
        id: tools
        run: |
          version() {
            value=$(sed -n "s/^ARG $1=//p" Dockerfile)
            if [ -z "$value" ]; then echo "ARG $1 is missing from the Dockerfile" >&2; exit 1; fi
            echo "$value"
          }
          nextest=$(version CARGO_NEXTEST_VERSION)
          llvm_cov=$(version CARGO_LLVM_COV_VERSION)
          deny=$(version CARGO_DENY_VERSION)
          echo "list=cargo-nextest@$nextest,cargo-llvm-cov@$llvm_cov,cargo-deny@$deny" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: ${{ steps.tools.outputs.list }}
          fallback: none
      - name: cargo xtask ci
        run: cargo xtask ci
      # lcov.info and junit.xml (nextest profile ci) both from the cov gate, the one test run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            lcov.info
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7
      # Pushes to develop, main and epic/** only (the push trigger names no other branch), and only after a green
      # run. What stays in target/: deps, build and .fingerprint of each profile, minus every package and target
      # name of this workspace; reports, binaries, examples and coverage data go.
      - name: Drop our own crates from target/
        if: github.event_name == 'push'
        run: |
          # Exact names only: a target called `wasm` must not take `wasm-bindgen` with it.
          names=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | .name, .targets[].name | ., gsub("-"; "_")] | unique | join("|")')
          ours=".*/(lib)?($names)-[0-9a-f]{16}(\..+)?"
          rm -rf target/nextest target/tmp target/doc
          find target -maxdepth 2 -type f \( -name '*.profraw' -o -name '*.profdata' -o -name '*-profraw-list' \) -delete
          profiles=$(find target -type d -name .fingerprint -prune -printf '%h\n')
          for profile in $profiles; do
            find "$profile" -mindepth 1 -maxdepth 1 ! -name deps ! -name build ! -name .fingerprint -exec rm -rf {} +
            find "$profile" -mindepth 2 -maxdepth 2 -regextype posix-extended -regex "$ours" -exec rm -rf {} +
          done
          du -sh target ~/.cargo/registry/index ~/.cargo/registry/cache
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache-key.outputs.key }}

  codecov:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # The upload maps the report paths onto the repository's files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports
          path: reports
      - name: Coverage
        if: needs.test.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: reports/lcov.info
          disable_search: true
          fail_ci_if_error: true
      - name: Test results
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          report_type: test_results
          files: reports/target/nextest/ci/junit.xml
          disable_search: true

  # Build proof for the dev Flatpak: the manifest `just flatpak` builds on the host, built offline from this checkout
  # and cargo-sources.json into a single-file bundle (docs/development.md, "Install the bundle from CI").
  flatpak:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Flathub's builder image with the 25.08 runtime and SDK, pinned by digest. Privileged because flatpak-builder runs
    # every build step in a bubblewrap sandbox; the job token stays read-only and the job holds no secret.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No flatpak-builder cache: nothing a PR run writes feeds a later run.
      - name: Build the bundle
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --install-deps-from=flathub --force-clean \
            --state-dir=target/flatpak/state --repo=target/flatpak/repo \
            target/flatpak/build contrib/flatpak/io.github.qubernetic.inboxcraft.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            target/flatpak/repo inboxcraft.flatpak io.github.qubernetic.inboxcraft
          ls -l inboxcraft.flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: inboxcraft.flatpak
          if-no-files-found: error
          retention-days: 7

  # The gate for the required-checks list: a skipped check reports as passing, so this job runs on every full run and
  # fails unless every job before it succeeded.
  ci:
    needs: [test, codecov, flatpak]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Every job succeeded
        env:
          TEST: ${{ needs.test.result }}
          CODECOV: ${{ needs.codecov.result }}
          FLATPAK: ${{ needs.flatpak.result }}
        run: |
          echo "test: $TEST, codecov: $CODECOV, flatpak: $FLATPAK"
          [ "$TEST" = success ] && [ "$CODECOV" = success ] && [ "$FLATPAK" = success ]
