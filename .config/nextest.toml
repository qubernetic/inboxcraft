nextest-version = "0.9.150"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 10 }

# CI uploads this to Codecov Test Analytics: target/nextest/ci/junit.xml.
[profile.ci.junit]
path = "junit.xml"

# The live tests (`live_*`, crates/testkit/tests/live.rs) always show their output, in every profile, so a skipped
# one prints its reason.
[[profile.default.overrides]]
filter = "test(/^live_/)"
success-output = "immediate"

# `just it-live`: only the live tests, one at a time, on the owner's two throwaway test accounts.
[profile.live]
default-filter = "test(/^live_/)"
test-threads = 1
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }
